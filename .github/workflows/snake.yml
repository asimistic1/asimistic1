name: Generate Contribution Snake

on:
  # runs every 12 hours to keep the snake fresh
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it manually from the Actions tab
  workflow_dispatch:
  # also runs whenever you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F5A623&color_dots=#1B0E33,#5B1E77,#8E2C8A,#C0367F,#FFB347
            dist/snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
